name: 每日自動更新熱搜

on:
  schedule:
    # 設定定時執行：台灣時間每天早上 8 點、下午 2 點、晚上 8 點自動抓取 (這是 UTC 時間 0, 6, 12)
    - cron: '0 0,6,12 * * *'
  workflow_dispatch: # 加上這個，讓我們隨時可以手動按按鈕執行

permissions:
  contents: write # 賦予機器人寫入檔案的權限

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 下載你的專案程式碼
      uses: actions/checkout@v3

    - name: 🐍 建立 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安裝必備套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml

    - name: 🚀 執行抓取與更新網頁腳本
      run: python update.py

    - name: 💾 將更新後的網頁存回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add index.html
        # 檢查檔案有沒有變動，如果有變更才進行 commit 與推播
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 自動更新今日熱搜資料"
        git push
